# Rebuild the course catalog and ship it.
#
# The crawl is ~545 paginated fetches over 8-10 minutes, which no serverless
# function will host -- Vercel's ceiling is far below that. So the catalog is a
# BUILD ARTIFACT: this workflow crawls, backfills dates, detects cross-listings,
# seals the database read-only, and commits it. That push is what triggers the
# Vercel deploy, so the site always serves a database built by a reproducible
# job rather than one uploaded from a laptop.
#
# Nothing here touches personal data: the catalog is public and identical for
# every student, and no login is involved at any point.

name: Refresh catalog

on:
  schedule:
    # Every 8 hours. 10:00 UTC = 06:00 America/New_York during EDT, kept as the
    # morning slot; GitHub cron has no timezone support, so these drift an hour
    # in winter -- fine for a catalog. Note GitHub delays scheduled runs under
    # load and disables them after 60 days with no repo activity.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      terms:
        description: 'Terms to crawl, comma-separated (blank = all of TERMS below)'
        required: false
        default: ""
      max_pages:
        description: "Limit pages (smoke test; blank = full crawl)"
        required: false
        default: ""

# Two crawls writing the same DB would race on the commit.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Every term the deployed site should offer. The UI's term dropdown is built
  # from whatever the database actually contains, so adding a term here is the
  # only change needed to make it selectable.
  TERMS: "2026 Fall,2027 Spring"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Full history: the rebase in the final step needs a merge base, which a
      # default shallow (depth 1) checkout does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ingest dependencies
        run: pip install -r requirements-ingest.txt

      # One pass per term: crawl, then backfill dates, then detect cross-listings.
      # Cross-listing detection is per-term by nature (it groups courses sharing
      # an instructor and meeting time), so it cannot be hoisted out of the loop.
      - name: Crawl, date and cross-list every term
        run: |
          set -euo pipefail
          TERM_LIST="${{ inputs.terms }}"
          [ -n "$TERM_LIST" ] || TERM_LIST="$TERMS"
          MAX_PAGES="${{ inputs.max_pages }}"

          echo "$TERM_LIST" | tr ',' '\n' | while IFS= read -r raw; do
            term="$(echo "$raw" | sed 's/^ *//; s/ *$//')"
            [ -n "$term" ] || continue

            echo "::group::$term"
            if [ -n "$MAX_PAGES" ]; then
              python -m ingest.crawl --term "$term" --max-pages "$MAX_PAGES"
            else
              python -m ingest.crawl --term "$term"
            fi

            # Partial-term courses (HSPH, HSDM, HGSE, HKS, HBSM, HMS) render an
            # empty session on search cards, so their real date ranges need
            # detail pages. Without them, two 7-week courses in opposite halves
            # of the term look like a conflict.
            python -m ingest.dates --term "$term"
            python -m ingest.crosslist "$term"
            echo "::endgroup::"
          done

      # Rebuild the approved lists from the spreadsheets so an edit to either
      # .xlsx reaches production without a manual step.
      - name: Regenerate approved lists
        run: python -m ingest.approved

      # WAL-mode databases cannot be opened read-only at all, and the deployed
      # API has no writable filesystem. This is not optional.
      - name: Seal the database for read-only serving
        run: python -m ingest.seal --in-place

      - name: Verify the artifact the way production opens it
        env:
          MDE_STRICT_READONLY: "1"
        run: |
          pip install -r requirements.txt httpx   # httpx backs TestClient
          python - <<'PY'
          from fastapi.testclient import TestClient
          from server.main import app
          c = TestClient(app)
          h = c.get("/api/health"); h.raise_for_status()
          print("health:", h.json())
          assert h.json()["courses"] > 1000, "catalog looks empty"

          m = c.get("/api/meta"); m.raise_for_status()
          terms = [t["term"] for t in m.json()["terms"]]
          print("terms in catalog:", terms)
          assert terms, "no terms ingested at all"

          # Every term the site offers must actually return results, or the
          # dropdown would show a term that searches to nothing.
          for term in terms:
              s = c.post("/api/search", json={"term": term, "include_tba": False, "limit": 1})
              s.raise_for_status()
              total = s.json()["total"]
              print(f"  search({term}): {total} sections satisfy a requirement")
              assert total > 100, f"{term} returned suspiciously few results"
          PY

      # The catalog is published as a ROLLING RELEASE ASSET, never committed.
      # It is ~11 MB of derived data rewritten in full on every refresh, so
      # committing it added that much permanent, undeltifiable history per
      # changed day -- three times a day on this schedule -- and git cannot
      # prune that without rewriting history. Only the current copy is
      # idempotent with my.harvard, so keeping old ones buys nothing.
      #
      # Not Git LFS: LFS still stores every version against a 1 GB allowance,
      # bills a separate bandwidth quota per checkout, and Vercel does not
      # fetch LFS objects at all -- the build would ship the ~130-byte pointer
      # file and SQLite would report the catalog as corrupt.
      - name: Publish the catalog as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COURSES=$(python -c "import sqlite3;print(sqlite3.connect('data/courses.db').execute('select count(*) from courses').fetchone()[0])")
          gh release view catalog >/dev/null 2>&1 || \
            gh release create catalog --title "Catalog artifact (rolling)" \
              --notes "Rolling artifact, replaced on every refresh. Not a version."
          gh release upload catalog data/courses.db --clobber
          gh release edit catalog --notes "Sealed read-only SQLite catalog: $COURSES sections.
          Rebuilt $(date -u +%Y-%m-%dT%H:%MZ) by refresh-catalog.yml.
          Replaced on every refresh; no history is kept."
          echo "Published $COURSES sections as the catalog asset."

      # approved_lists.yaml is still committed: small, text, diffable, and a
      # change to it means someone edited the source spreadsheets, which is
      # worth seeing in history. The catalog is no longer part of this step.
      - name: Commit regenerated approved lists
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved_lists.yaml
          if git diff --cached --quiet; then
            echo "Approved lists unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate approved lists"

          # The crawl runs for ~15 minutes, so main has usually moved on by the
          # time we get here and a plain push is rejected -- which used to throw
          # away the whole crawl. Rebase our single generated commit onto
          # whatever landed and try again.
          #
          # Rebase, not merge, and never --force: replaying our commit means the
          # only file we carry forward is the generated one, so concurrent
          # source edits are preserved rather than reverted to our stale checkout.
          pushed=0
          for attempt in $(seq 1 5); do
            if git push; then
              echo "Pushed on attempt $attempt."
              pushed=1
              break
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase conflicted on approved_lists.yaml -- it was"
              echo "::error::edited by hand. Refusing to force-push."
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::main kept moving; still could not push after 5 attempts."
            exit 1
          fi

      # Nothing pushes to git on a normal refresh now, so the deploy has to be
      # requested explicitly -- otherwise the asset would be updated and never
      # served. Set the VERCEL_DEPLOY_HOOK secret to a Vercel Deploy Hook URL.
      # `if: always()` so a failed approved-lists push still ships the catalog.
      - name: Trigger the Vercel deploy
        if: always()
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set -- the new catalog was published but will not be served until the next deploy."
            exit 0
          fi
          curl -sS --fail-with-body -X POST "$HOOK" -o /dev/null
          echo "Deploy triggered."
